[settings]
lockfile = true

# Each tool is pinned to the backend it comes from, so the config states the
# source instead of leaning on whatever mise's registry picks by default.
[tool_alias]
babashka = "github:babashka/babashka"
bats = "aqua:bats-core/bats-core"
circleci-cli = "aqua:CircleCI-Public/circleci-cli"
java = "core:java"
python = "core:python"
shellcheck = "aqua:koalaman/shellcheck"
shfmt = "aqua:mvdan/sh"
uv = "aqua:astral-sh/uv"
yamlfmt = "aqua:google/yamlfmt"
yamllint = "pipx:yamllint"

[tools]
# releases: https://github.com/babashka/babashka/releases
# changelog: https://github.com/babashka/babashka/blob/master/CHANGELOG.md
# Runs sosh, which fetches the shell-gr helpers the @bin scripts source.
babashka = { version = "1.13.220", depends = ["java"] }

# releases: https://github.com/bats-core/bats-core/releases
# changelog: https://github.com/bats-core/bats-core/blob/master/docs/CHANGELOG.md
# Runs the tests under test/ - `make test`.
bats = "1.14.0"

# releases: https://github.com/CircleCI-Public/circleci-cli/releases
# Packs and validates the orb - `make orb/validate`.
circleci-cli = "1.0.49838"

# versions: https://github.com/adoptium/temurin21-binaries/releases
# changelog: https://adoptium.net/temurin/release-notes/?version=21 (skip)
java = "temurin-21.0.12+101.0.LTS"

# downloads: https://www.python.org/downloads/
# history: https://python3.info/about/versions.html
# changelog: https://docs.python.org/3/whatsnew/changelog.html
# The `pipx:` backend builds the tool venv from this interpreter. Without the
# entry mise falls back to whatever python the machine happens to have.
python = "3.14.7"

# releases: https://github.com/koalaman/shellcheck/releases
# changelog: https://github.com/koalaman/shellcheck/blob/master/CHANGELOG.md
shellcheck = "0.11.0"

# releases: https://github.com/mvdan/sh/releases
# changelog: https://github.com/mvdan/sh/blob/master/CHANGELOG.md
# The tool lives in the mvdan/sh repo, the command is `shfmt`.
shfmt = "3.14.1"

# releases: https://github.com/astral-sh/uv/releases
# changelog: https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
# Installs the tools that come from the `pipx:` backend. yamllint is the only one.
uv = "0.12.12"

# releases: https://github.com/google/yamlfmt/releases
# changelog: https://github.com/google/yamlfmt/blob/main/CHANGELOG.md
yamlfmt = "0.21.0"

# releases: https://github.com/adrienverge/yamllint/releases
# changelog: https://github.com/adrienverge/yamllint/blob/master/CHANGELOG.rst
# yamllint ships from PyPI. uv installs it, python is what the venv runs on.
# mise refuses to install it unless both are installed first.
yamllint = { version = "1.38.0", depends = ["uv", "python"] }

[tasks."deps"]
run = "mise outdated --bump"
[tasks."deps:upgrade"]
run = "mise outdated --bump && mise upgrade --bump --interactive"

# `mise lock` only updates or adds entries, it never drops them. After renaming a
# tool key the entry under the old name stays in the lockfile, so recreate the
# file from scratch instead of refreshing it in place.
[tasks."lock:recreate"]
description = "Recreate mise.lock from scratch"
run = "rm -f mise.lock && mise lock"
